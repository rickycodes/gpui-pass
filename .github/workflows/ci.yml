name: CI

on:
  push:
    branches: main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      pass: ${{ steps.filter.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - 'assets/**'
              - 'locales/**'
              - 'vendor/**'
              - 'rust-toolchain*'
              - 'scripts/check-rust-warnings.sh'
              - '.github/workflows/ci.yml'
            python:
              - 'desktop/**/*.py'
              - 'desktop/requirements-test.txt'
              - '.github/workflows/ci.yml'
            pass:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'vendor/**'
              - 'scripts/test-pass-compat.sh'
              - '.github/workflows/ci.yml'

  checks:
    name: Rust tests and checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake pkg-config libclang-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - name: Lint core
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Reject compiler and dependency warnings
        run: |
          bash scripts/check-rust-warnings.sh
          bash scripts/check-rust-warnings.sh --manifest-path desktop/Cargo.toml
      - name: Test core
        # Keep subprocess-heavy cancellation tests deterministic under runner load.
        run: cargo test --locked -- --test-threads=1
      - name: Lint desktop
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test desktop
        run: |
          cargo test --manifest-path desktop/Cargo.toml --locked
          cargo test --manifest-path desktop/Cargo.toml -p blade-graphics --lib prime_presentation_tests --locked


  dependency-audit:
    name: Rust dependency audit
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit core lockfile
        run: cargo audit --file Cargo.lock
      - name: Audit desktop lockfile
        run: cargo audit --file desktop/Cargo.lock
  python-tests:
    name: Python helper tests
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: python3 -m pip install -r desktop/requirements-test.txt
      - name: Test Python helpers
        run: python3 -m unittest discover -s desktop/tests -v

  pass-integration:
    name: pass and GnuPG integration
    needs: changes
    if: needs.changes.outputs.pass == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pass and GnuPG
        run: |
          sudo apt-get update
          sudo apt-get install --yes pass gnupg
      - name: Run disposable pass compatibility fixture
        run: bash scripts/test-pass-compat.sh
