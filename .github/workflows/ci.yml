name: CI

on:
  push:
    branches: main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      pass: ${{ steps.filter.outputs.pass }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - 'assets/**'
              - 'locales/**'
              - 'vendor/**'
              - 'rust-toolchain*'
              - 'scripts/check-rust-warnings.sh'
              - '.github/workflows/ci.yml'
            python:
              - 'desktop/**/*.py'
              - 'desktop/requirements-test.txt'
              - '.github/workflows/ci.yml'
            pass:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'vendor/**'
              - 'scripts/test-pass-compat.sh'
              - '.github/workflows/ci.yml'

  checks:
    name: Rust tests and checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake pkg-config libclang-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - name: Lint core
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Reject compiler and dependency warnings
        run: |
          bash scripts/check-rust-warnings.sh
          bash scripts/check-rust-warnings.sh --manifest-path desktop/Cargo.toml
      - name: Test core
        # Keep subprocess-heavy cancellation tests deterministic under runner load.
        run: cargo test --locked -- --test-threads=1
      - name: Lint desktop
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test desktop
        run: |
          cargo test --manifest-path desktop/Cargo.toml --locked
          cargo test --manifest-path desktop/Cargo.toml -p blade-graphics --lib prime_presentation_tests --locked


  dependency-audit:
    name: Rust dependency and quality checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit core lockfile
        run: cargo audit --file Cargo.lock
      - name: Audit desktop lockfile
        run: cargo audit --file desktop/Cargo.lock
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check core dependency policy
        run: cargo deny check all
      - name: Check desktop dependency policy
        working-directory: desktop
        run: cargo deny check all
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check core dependency usage
        run: cargo machete
      - name: Check desktop dependency usage
        working-directory: desktop
        run: cargo machete

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          fail-on-severity: high
  python-tests:
    name: Python helper tests
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python test dependencies
        run: python3 -m pip install -r desktop/requirements-test.txt
      - name: Test Python helpers
        run: python3 -m unittest discover -s desktop/tests -v

  pass-integration:
    name: pass and GnuPG integration
    needs: changes
    if: needs.changes.outputs.pass == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pass and GnuPG
        run: |
          sudo apt-get update
          sudo apt-get install --yes pass gnupg
      - name: Run disposable pass compatibility fixture
        run: bash scripts/test-pass-compat.sh
