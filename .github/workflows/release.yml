name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New v* tag to create and publish"
        required: true
        type: string

permissions:
  contents: read
env:
  APP_NAME: gpui-pass
  PLATFORM: linux-x86_64


jobs:
  build-linux:
    name: Optimized Linux x86_64 binary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: bash scripts/check-release-version.sh "$RELEASE_TAG"
      - name: Verify signed release tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ref_type=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.type')
          if [[ "$ref_type" != "tag" ]]; then
            echo "$RELEASE_TAG is not an annotated tag." >&2
            exit 1
          fi
          tag_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.sha')
          verified=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
            --jq '.verification.verified')
          reason=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
            --jq '.verification.reason')
          if [[ "$verified" != "true" || "$reason" != "valid" ]]; then
            echo "$RELEASE_TAG has no valid GitHub-verified signature (reason: $reason)." >&2
            exit 1
          fi
          echo "$RELEASE_TAG is a GitHub-verified signed tag."
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake pkg-config libclang-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev \
            desktop-file-utils
      - name: Build optimized binary
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      # Pin tool releases and the AppImage runtime by SHA-256; refresh intentionally.
      - name: Download pinned AppImage tooling
        run: |
          tool_dir="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tool_dir"
          curl -fsSL --retry 3 -o "$tool_dir/linuxdeploy.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71a3e4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $tool_dir/linuxdeploy.AppImage" | sha256sum --check
          curl -fsSL --retry 3 -o "$tool_dir/linuxdeploy-plugin-appimage.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage
          echo "992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3  $tool_dir/linuxdeploy-plugin-appimage.AppImage" | sha256sum --check
          curl -fsSL --retry 3 -o "$tool_dir/runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  $tool_dir/runtime-x86_64" | sha256sum --check
          chmod 755 "$tool_dir"/*.AppImage
          ln -s "$tool_dir/linuxdeploy-plugin-appimage.AppImage" \
            "$tool_dir/linuxdeploy-plugin-appimage"
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Package binary and desktop integration
        run: |
          mkdir -p dist
          install -m 755 desktop/target/release/gpui-pass dist/gpui-pass
          install -m 644 packaging/dev.gpui-pass.desktop dist/dev.gpui-pass.desktop
          install -m 644 assets/gpui-pass.svg dist/gpui-pass.svg
          desktop-file-validate packaging/dev.gpui-pass.desktop
          cat > dist/INSTALL.txt <<'EOF'
          gpui-pass Linux x86_64

          This binary was built on Ubuntu 24.04. It requires GnuPG and the system
          graphics/audio libraries used by GPUI; those shared libraries are not
          bundled in this archive. See the project README for the Ubuntu package
          list and GnuPG setup notes.

          Try the app without a real password store:
            ./gpui-pass --demo

          Install for the current user:
            install -Dm755 gpui-pass "$HOME/.local/bin/gpui-pass"
            install -Dm644 dev.gpui-pass.desktop "$HOME/.local/share/applications/dev.gpui-pass.desktop"
            install -Dm644 gpui-pass.svg "$HOME/.local/share/icons/hicolor/scalable/apps/gpui-pass.svg"
          EOF
          archive="$APP_NAME-$PLATFORM.tar.gz"
          checksum="$archive.sha256"
          tar -czf "dist/$archive" -C dist \
            gpui-pass INSTALL.txt dev.gpui-pass.desktop gpui-pass.svg
          (cd dist && sha256sum "$archive" > "$checksum")
      - name: Package AppImage
        env:
          LDAI_RUNTIME_FILE: ${{ runner.temp }}/appimage-tools/runtime-x86_64
        run: |
          appimage="$APP_NAME-$PLATFORM.AppImage"
          checksum="$appimage.sha256"
          bash scripts/package-appimage.sh desktop/target/release/gpui-pass \
            "dist/$appimage"
          (cd dist && sha256sum "$appimage" > "$checksum")
      - name: Generate release provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.tar.gz
            dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.AppImage
      - name: Upload release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.APP_NAME }}-${{ env.PLATFORM }}
          path: |
            dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.tar.gz
            dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.tar.gz.sha256
            dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.AppImage
            dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.AppImage.sha256
          if-no-files-found: error
          retention-days: 30

  verify-artifact:
    name: Verify release artifact
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ env.APP_NAME }}-${{ env.PLATFORM }}
          path: dist
      - uses: ./.github/actions/verify-release
        with:
          archive: dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.tar.gz
          checksum: dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.tar.gz.sha256
      - name: Verify AppImage
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          bash scripts/verify-appimage.sh \
            "dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.AppImage" \
            "dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.AppImage.sha256"


  publish-release:
    name: Attach assets to GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build-linux, verify-artifact]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ env.APP_NAME }}-${{ env.PLATFORM }}
          path: dist
      - name: Create release and upload binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null; then
              echo "Tag $RELEASE_TAG already exists on the remote." >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          else
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/$APP_NAME-$PLATFORM.tar.gz" \
            "dist/$APP_NAME-$PLATFORM.tar.gz.sha256" \
            "dist/$APP_NAME-$PLATFORM.AppImage" \
            "dist/$APP_NAME-$PLATFORM.AppImage.sha256" \
            --clobber

  verify-published-release:
    name: Verify published release assets
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: publish-release
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$APP_NAME-$PLATFORM.tar.gz" \
            --pattern "$APP_NAME-$PLATFORM.tar.gz.sha256" \
            --pattern "$APP_NAME-$PLATFORM.AppImage" \
            --pattern "$APP_NAME-$PLATFORM.AppImage.sha256" \
            --dir dist
      - name: Verify release provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "dist/$APP_NAME-$PLATFORM.tar.gz" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "dist/$APP_NAME-$PLATFORM.AppImage" --repo "$GITHUB_REPOSITORY"
      - uses: ./.github/actions/verify-release
        with:
          archive: dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.tar.gz
          checksum: dist/${{ env.APP_NAME }}-${{ env.PLATFORM }}.tar.gz.sha256
