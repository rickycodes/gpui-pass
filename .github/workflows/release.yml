name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New v* tag to create and publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Optimized Linux x86_64 binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Verify signed release tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ref_type=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.type')
          if [[ "$ref_type" != "tag" ]]; then
            echo "$RELEASE_TAG is not an annotated tag." >&2
            exit 1
          fi
          tag_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.sha')
          verified=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
            --jq '.verification.verified')
          reason=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
            --jq '.verification.reason')
          if [[ "$verified" != "true" || "$reason" != "valid" ]]; then
            echo "$RELEASE_TAG has no valid GitHub-verified signature (reason: $reason)." >&2
            exit 1
          fi
          echo "$RELEASE_TAG is a GitHub-verified signed tag."
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake pkg-config libclang-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev
      - name: Build optimized binary
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      - name: Package binary and checksum
        run: |
          mkdir -p dist
          install -m 755 desktop/target/release/gpui-pass dist/gpui-pass
          cat > dist/INSTALL.txt <<'EOF'
          gpui-pass Linux x86_64

          This binary was built on Ubuntu 24.04. It requires GnuPG and the system
          graphics/audio libraries used by GPUI; those shared libraries are not
          bundled in this archive. See the project README for the Ubuntu package
          list and GnuPG setup notes.

          Try the app without a real password store:
            ./gpui-pass --demo

          Install for the current user:
            install -Dm755 gpui-pass "$HOME/.local/bin/gpui-pass"
          EOF
          tar -czf dist/gpui-pass-linux-x86_64.tar.gz -C dist gpui-pass INSTALL.txt
          (cd dist && sha256sum gpui-pass-linux-x86_64.tar.gz > gpui-pass-linux-x86_64.tar.gz.sha256)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-pass-linux-x86_64
          path: |
            dist/gpui-pass-linux-x86_64.tar.gz
            dist/gpui-pass-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  verify-artifact:
    name: Verify release artifact
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: gpui-pass-linux-x86_64
          path: dist
      - name: Install runtime and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb \
            build-essential clang cmake pkg-config libclang-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev \
            mesa-vulkan-drivers
      - name: Verify checksum, install, and launch
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          bash scripts/verify-release.sh \
            dist/gpui-pass-linux-x86_64.tar.gz \
            dist/gpui-pass-linux-x86_64.tar.gz.sha256


  publish-release:
    name: Attach assets to GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build-linux, verify-artifact]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: gpui-pass-linux-x86_64
          path: dist
      - name: Create release and upload binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null; then
              echo "Tag $RELEASE_TAG already exists on the remote." >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          else
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/gpui-pass-linux-x86_64.tar.gz dist/gpui-pass-linux-x86_64.tar.gz.sha256 --clobber

  verify-published-release:
    name: Verify published release assets
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'gpui-pass-linux-x86_64.tar.gz' \
            --pattern 'gpui-pass-linux-x86_64.tar.gz.sha256' \
            --dir dist
      - name: Install runtime and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb \
            build-essential clang cmake pkg-config libclang-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev \
            mesa-vulkan-drivers
      - name: Verify downloaded release
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          bash scripts/verify-release.sh \
            dist/gpui-pass-linux-x86_64.tar.gz \
            dist/gpui-pass-linux-x86_64.tar.gz.sha256
