version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-dependencies:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: "/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-dependencies:
        patterns:
          - "*"
