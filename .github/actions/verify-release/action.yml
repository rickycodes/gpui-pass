name: Verify release artifact
description: Verify a packaged gpui-pass release under a headless software Vulkan display
inputs:
  archive:
    description: Path to the release archive
    required: true
  checksum:
    description: Path to the archive checksum file
    required: true
runs:
  using: composite
  steps:
    - name: Install runtime and smoke-test dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes xvfb \
          build-essential clang cmake pkg-config libclang-dev \
          libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
          libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev \
          mesa-vulkan-drivers
    - name: Verify checksum, install, and launch
      shell: bash
      run: |
        bash "$GITHUB_WORKSPACE/scripts/verify-release.sh" \
          "${{ inputs.archive }}" \
          "${{ inputs.checksum }}"
