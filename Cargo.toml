[package]
name = "gpui-pass-core"
version = "1.0.4"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Pass store backend, independent of the desktop UI"

[dependencies]
zeroize = "=1.9.2"
getrandom = "=0.4.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "=3.27.0"
