# (or ~/.config/gpui-pass/theme.toml when XDG_CONFIG_HOME is unset).
# Any omitted values keep the built-in defaults.

[colors]
background = "#20242b"
surface = "#292f38"
ink = "#e5e9f0"
muted = "#a8b0bd"
border = "#424a57"
accent = "#82c7a5"
accent_hover = "#6bb58f"
accent_surface = "#34463e"
danger = "#f08080"
danger_border = "#7c4147"
danger_surface = "#452e34"
