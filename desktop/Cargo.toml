[package]
name = "gpui-pass"
version = "1.0.4"
edition = "2024"
rust-version = "1.85"
publish = false

# Keep the security backend independently buildable without resolving GPUI.
[workspace]

[dependencies]
gpui = "=0.2.2"
gpui-pass-core = { path = ".." }
lyon_tessellation = "=1.0.23"
zeroize = "=1.8.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
fluent-bundle = "0.15"
unic-langid = "0.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[patch.crates-io]
# GPUI's zed-async-tar still requires xattr 0.2; adapt its Linux errno to current libc.
xattr = { path = "../vendor/xattr" }
# Avoid CPU rendering when a stale PRIME flag hides the only hardware GPU.
blade-graphics = { path = "../vendor/blade-graphics" }
# Fix a private extern-crate re-export rejected by future Rust versions.
proc-macro-error2 = { path = "../vendor/proc-macro-error2" }

[profile.release]
panic = "abort"
strip = true
lto = "thin"
codegen-units = 1

# GPUI, text shaping, and path tessellation are expensive without optimization.
# Keep application code easy to debug while making normal `cargo run` practical.
[profile.dev.package."*"]
opt-level = 2
