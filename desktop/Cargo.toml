[package]
name = "gpui-pass"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Keep the security backend independently buildable without resolving GPUI.
[workspace]

[dependencies]
gpui = "=0.2.2"
gpui-pass-core = { path = ".." }
zeroize = "=1.8.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
fluent-bundle = "0.15"
unic-langid = "0.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[patch.crates-io]
# GPUI's zed-async-tar still requires xattr 0.2; adapt its Linux errno to current libc.
xattr = { path = "../vendor/xattr" }

[profile.release]
panic = "abort"
strip = true
